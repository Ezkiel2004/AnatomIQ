<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notifications – AnatomIQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../assets/css/global.css?v=20260914-icons1"/>
  <link rel="stylesheet" href="../assets/css/sidebar.css?v=20260914-bg1"/>
  <link rel="stylesheet" href="../assets/css/student.css"/>
  <link rel="stylesheet" href="../assets/css/teacher-dashboard.css"/>
</head>
<body class="teacher-dashboard student-dashboard">
<div class="app-layout">
  <aside class="sidebar" id="sidebar" data-portal="student" aria-label="Student portal"><script src="../assets/js/sidebar.js?v=20260914-icons1"></script></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <main class="main-content" id="mainContent">
    <header class="topbar">
      <button class="topbar-toggle" id="sidebarToggle" aria-label="Toggle navigation"><svg class="ui-icon" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../assets/icons/interface.svg?v=20260914-icons1#list"/></svg></button>
      <div class="topbar-breadcrumb"><span class="breadcrumb-item">Student Portal</span><span class="breadcrumb-sep">/</span><span class="breadcrumb-current">Notifications</span></div>
      <div class="topbar-actions">
        <div style="position:relative;">
          <button class="notif-btn" id="notifBtn" aria-label="View notifications">
            <svg class="ui-icon" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../assets/icons/interface.svg?v=20260914-icons1#bell"/></svg>
            <span class="notif-dot"></span>
          </button>
          <div class="notif-dropdown" id="notifDropdown" style="display:none;">
            <div class="notif-header"><span>Notifications</span></div>
            <div class="notif-list"></div>
          </div>
        </div>
        <a href="settings.html" class="topbar-user" style="text-decoration:none;color:inherit;" title="Manage Account"><div class="avatar" style="width:32px;height:32px;font-size:0.75rem;">MS</div><div><div class="topbar-user-name">Student</div></div></a>
      </div>
    </header>

    <div class="page-content">
      <div class="page-header">
        <div class="page-header-left">
          <h1 style="font-size:clamp(1.25rem,2.5vw,1.75rem);font-weight:700;color:var(--text-primary);letter-spacing:-0.02em;margin:0 0 4px 0;">Notifications &amp; Announcements</h1>
          <p style="margin:0;font-size:0.875rem;color:var(--text-secondary);">Stay updated with new lessons, quiz reminders, teacher feedback, and school announcements.</p>
        </div>
        <div class="page-header-right">
          <button class="btn btn-secondary btn-sm" onclick="markAllRead()">Mark All Read</button>
        </div>
      </div>

      <!-- Filter Tabs -->
      <div style="display:flex;gap:var(--space-2);margin-bottom:var(--space-6);flex-wrap:wrap;" id="filterTabs">
        <div class="chip active" onclick="filterNotifs(this,'all')">All <span id="countAll"></span></div>
        <div class="chip" onclick="filterNotifs(this,'unread')">Unread <span id="countUnread"></span></div>
        <div class="chip" onclick="filterNotifs(this,'lesson')">Lessons</div>
        <div class="chip" onclick="filterNotifs(this,'quiz')">Quizzes</div>
        <div class="chip" onclick="filterNotifs(this,'score')">Scores</div>
        <div class="chip" onclick="filterNotifs(this,'announcement')">Announcements</div>
      </div>

      <!-- Notifications List -->
      <div style="display:flex;flex-direction:column;gap:var(--space-3);" id="notifList">
        <div style="text-align:center;padding:var(--space-8);color:var(--text-muted);">Loading notifications...</div>
      </div>
    </div>
  </main>
</div>

<script src="../assets/js/app.js?v=20260914-icons1"></script>
<script>
Auth.requireAuthSync('student');

let notifItems = [];
let currentFilter = 'all';

async function loadNotifications() {
  try {
    const res = await fetch(`${API_BASE}/notifications.php`, { credentials: 'same-origin' });
    const result = await res.json();
    if (!result.success) throw new Error(result.message);

    notifItems = Array.isArray(result.data) ? result.data : [];
    updateCounts();
    renderNotifs();
  } catch (err) {
    console.error('Failed to load notifications:', err);
    document.getElementById('notifList').innerHTML = `<div style="text-align:center;padding:var(--space-8);color:var(--error);">Failed to load notifications: ${escHtml(err.message)}</div>`;
  }
}

function updateCounts() {
  const total = notifItems.length;
  const unread = notifItems.filter(n => n.unread).length;

  const countAll = document.getElementById('countAll');
  if (countAll) countAll.textContent = `(${total})`;

  const countUnread = document.getElementById('countUnread');
  if (countUnread) countUnread.textContent = `(${unread})`;

  // Update nav badge in sidebar
  document.querySelectorAll('.sidebar-nav a[href*="notifications"] .nav-badge').forEach(badge => {
    badge.textContent = unread;
    badge.style.display = unread > 0 ? 'inline-block' : 'none';
  });
}

function filterNotifs(el, f) {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  currentFilter = f;
  renderNotifs();
}

function renderNotifs() {
  let data = notifItems;
  if (currentFilter !== 'all') {
    if (currentFilter === 'unread') data = data.filter(n => n.unread);
    else data = data.filter(n => n.type === currentFilter);
  }

  if (data.length === 0) {
    const emptyMsg = currentFilter === 'unread'
      ? 'All caught up! No unread notifications.'
      : 'No notifications found in this category.';
    document.getElementById('notifList').innerHTML = `<div style="text-align:center;padding:var(--space-10);color:var(--text-muted);">${emptyMsg}</div>`;
    return;
  }

  document.getElementById('notifList').innerHTML = data.map((n, i) => `
    <div onclick="readNotif('${n.id}', '${n.action || '#'}')"
         style="display:flex;gap:var(--space-4);padding:var(--space-4) var(--space-5);background:${n.unread ? 'var(--brand-50)' : 'var(--bg-surface)'};border:1px solid var(--border);${n.unread ? 'border-left:3px solid var(--brand);' : ''}border-radius:var(--radius-lg);cursor:pointer;transition:all 0.2s;"
         id="notif-card-${n.id}">
      <div style="width:40px;height:40px;border-radius:var(--radius-md);background:var(--bg-inset);border:1px solid var(--border-light);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);flex-shrink:0;">${n.icon || '<svg width="18" height="18" class="ui-icon" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../assets/icons/interface.svg?v=20260914-icons1#bell"/></svg>'}</div>
      <div style="flex:1;">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-1);">
          <div style="font-size:0.875rem;font-weight:${n.unread ? '600' : '500'};color:var(--text-primary);">${escHtml(n.title)}</div>
          ${n.unread ? '<div style="width:7px;height:7px;border-radius:50%;background:var(--brand);flex-shrink:0;margin-top:5px;"></div>' : ''}
        </div>
        <div style="font-size:0.8125rem;color:var(--text-secondary);line-height:1.5;">${escHtml(n.body)}</div>
        <div style="font-size:0.6875rem;color:var(--text-muted);margin-top:var(--space-2);">${escHtml(n.time || '')}</div>
      </div>
    </div>
  `).join('');
}

async function readNotif(id, action) {
  const item = notifItems.find(n => n.id === id);
  if (item && item.unread) {
    item.unread = false;
    updateCounts();

    const card = document.getElementById(`notif-card-${id}`);
    if (card) {
      card.style.background = 'var(--bg-surface)';
      card.style.borderColor = 'var(--border)';
      card.style.borderLeft = '1px solid var(--border)';
      const dot = card.querySelector('[style*="border-radius:50%"]');
      if (dot) dot.remove();
    }

    try {
      await fetch(`${API_BASE}/notifications/mark-read.php`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ id: id })
      });
    } catch (e) {
      console.warn('Could not mark notification as read:', e);
    }
  }

  if (action && action !== '#' && !action.includes('notifications.html')) {
    setTimeout(() => { window.location.href = action; }, 150);
  }
}

async function markAllRead() {
  notifItems.forEach(n => n.unread = false);
  updateCounts();
  renderNotifs();

  try {
    const res = await fetch(`${API_BASE}/notifications/mark-read.php`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ all: true })
    });
    const result = await res.json();
    if (result.success) {
      showToast('All notifications marked as read!', 'success');
    }
  } catch (err) {
    showToast('Failed to mark all as read.', 'error');
  }
}

// Dropdown toggle
const notifBtn = document.getElementById('notifBtn');
const notifDropdown = document.getElementById('notifDropdown');
if (notifBtn && notifDropdown) {
  notifBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    notifDropdown.style.display = notifDropdown.style.display === 'none' ? 'block' : 'none';
  });
  document.addEventListener('click', (e) => {
    if (!notifDropdown.contains(e.target) && e.target !== notifBtn) {
      notifDropdown.style.display = 'none';
    }
  });
}

// Initial load
loadNotifications();
</script>
<script src="../assets/js/site-config.js"></script>
</body>
</html>
